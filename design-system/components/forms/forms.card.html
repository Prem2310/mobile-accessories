<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:20px;font:var(--type-body)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Input,SearchBar,Select,Checkbox,QuantityStepper,Icon}=window.RaghavMobileAccessoriesDesignSystem_092910;
function App(){const[q,setQ]=React.useState("");const[c,setC]=React.useState(true);const[n,setN]=React.useState(2);
return <div style={{display:"grid",gap:16}}>
<SearchBar value={q} onChange={e=>setQ(e.target.value)}/>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
<Input label="WhatsApp number" placeholder="98xxxxxxxx" hint="Only for order updates" iconLeft={<Icon name="phone" size={16} color="var(--gray-400)"/>}/>
<Input label="Pincode" defaultValue="3820" error="Enter a valid 6-digit pincode"/>
<Select label="Phone model" options={["iPhone 15","Redmi Note 13","Galaxy A55"]}/>
<div><span style={{display:"block",font:"var(--fw-bold) var(--fs-sm)/1.2 var(--font-body)",color:"var(--text-strong)",marginBottom:8}}>Quantity</span><QuantityStepper value={n} onChange={setN}/></div>
</div>
<div style={{display:"flex",gap:24}}><Checkbox label="Tempered glass" count={42} checked={c} onChange={()=>setC(!c)}/><Checkbox label="Back covers" count={128}/></div>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
