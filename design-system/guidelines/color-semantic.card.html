<!-- @dsCard group="Colors" viewport="700x170" name="Status & channel" subtitle="Stock, savings, errors, plus WhatsApp / Instagram channel colours" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-card);font:var(--type-body)}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-bold) 11px/1.2 var(--font-mono)}.g{display:grid;gap:10px}</style>
</head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--green-600);color:#fff">stock</div><div style="margin-top:6px;font:var(--fw-bold) 11px/1.3 var(--font-mono);color:var(--text-muted)">--green-600</div></div><div><div class="sw" style="background:var(--red-600);color:#fff">error</div><div style="margin-top:6px;font:var(--fw-bold) 11px/1.3 var(--font-mono);color:var(--text-muted)">--red-600</div></div><div><div class="sw" style="background:var(--amber-600);color:#fff">warn</div><div style="margin-top:6px;font:var(--fw-bold) 11px/1.3 var(--font-mono);color:var(--text-muted)">--amber-600</div></div><div><div class="sw" style="background:var(--whatsapp);color:#fff">whatsapp</div><div style="margin-top:6px;font:var(--fw-bold) 11px/1.3 var(--font-mono);color:var(--text-muted)">--whatsapp</div></div><div><div class="sw" style="background:var(--whatsapp-dark);color:#fff">wa dark</div><div style="margin-top:6px;font:var(--fw-bold) 11px/1.3 var(--font-mono);color:var(--text-muted)">--whatsapp-dark</div></div><div><div class="sw" style="background:var(--instagram);color:#fff">instagram</div><div style="margin-top:6px;font:var(--fw-bold) 11px/1.3 var(--font-mono);color:var(--text-muted)">--instagram</div></div></div></body></html>
