<!-- @dsCard group="Brand" viewport="700x170" name="Motion & states" subtitle="120–320ms, ease-out; hover lifts 2px, press shrinks to .975" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-card);font:var(--type-body)}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-bold) 11px/1.2 var(--font-mono)}.g{display:grid;gap:10px}</style>
</head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<button style="height:44px;padding:0 24px;border:0;border-radius:var(--radius-pill);background:var(--orange-500);color:#fff;font:var(--fw-bold) 15px/1 var(--font-body);box-shadow:var(--shadow-brand)">Rest</button>
<button style="height:44px;padding:0 24px;border:0;border-radius:var(--radius-pill);background:var(--orange-600);color:#fff;font:var(--fw-bold) 15px/1 var(--font-body);transform:translateY(-2px);box-shadow:var(--shadow-hover)">Hover −2px</button>
<button style="height:44px;padding:0 24px;border:0;border-radius:var(--radius-pill);background:var(--orange-700);color:#fff;font:var(--fw-bold) 15px/1 var(--font-body);transform:scale(.975);box-shadow:var(--inset-press)">Press .975</button>
<span style="display:inline-flex;height:44px;align-items:center;padding:0 24px;border-radius:var(--radius-pill);background:var(--orange-500);color:#fff;font:var(--fw-bold) 15px/1 var(--font-body);box-shadow:var(--ring-brand);opacity:.45">Disabled .45</span></div>
<div style="margin-top:12px;font:var(--fw-medium) 11px/1.4 var(--font-mono);color:var(--text-muted)">--dur-fast 120 / --dur-base 200 / --dur-slow 320 · --ease-out cubic-bezier(.2,.8,.3,1)</div></body></html>
