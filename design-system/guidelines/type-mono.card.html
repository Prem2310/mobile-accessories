<!-- @dsCard group="Type" viewport="700x150" name="Mono & numerals" subtitle="DM Mono for quantities, SKUs and counts; prices use body bold" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-card);font:var(--type-body)}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-bold) 11px/1.2 var(--font-mono)}.g{display:grid;gap:10px}</style>
</head><body><div style="display:flex;gap:28px;align-items:baseline;flex-wrap:wrap">
<span style="font:var(--fw-bold) 26px/1 var(--font-body);color:var(--price)">₹1,299</span>
<span style="font:var(--fw-medium) 15px/1 var(--font-body);color:var(--price-strike);text-decoration:line-through">₹1,999</span>
<span style="font:var(--fw-bold) 15px/1 var(--font-body);color:var(--save)">35% off</span>
<span style="font:var(--fw-medium) 15px/1 var(--font-mono);color:var(--text-muted)">SKU RM-TG-1301 · qty 02</span></div>
<div style="margin-top:12px;font:var(--fw-medium) 11px/1.4 var(--font-mono);color:var(--text-muted)">₹ always prefixed, Indian digit grouping (1,29,900)</div></body></html>
