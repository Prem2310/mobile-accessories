<!DOCTYPE html><html><head><meta charset="utf-8"><title>Raghav Mobile Accessories — storefront</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>body{background:var(--surface-page)}</style></head>
<body><template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#0a2153"/><text x="100" y="118" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-weight="800" font-size="72" fill="#ffffff">R<tspan fill="#f26a00">a</tspan></text></svg></template><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="CategoryScreen.jsx"></script>
<script type="text/babel" src="ProductScreen.jsx"></script>
<script type="text/babel" src="CartScreen.jsx"></script>
<script type="text/babel">
const {WhatsAppCTA}=window.RaghavMobileAccessoriesDesignSystem_092910;
function App(){
 const [route,setRoute]=React.useState({screen:"home"});
 const [items,setItems]=React.useState([]);
 const add=(p,qty=1)=>setItems(cur=>cur.some(x=>x.id===p.id)?cur.map(x=>x.id===p.id?{...x,qty:x.qty+qty}:x):cur.concat([{...p,qty}]));
 const count=items.reduce((s,i)=>s+i.qty,0);
 const active=route.screen==="home"?"home":route.cat;
 return <div>
  <TopStrip/>
  <Header cartCount={count} onNav={setRoute} active={active}/>
  {route.screen==="home"&&<HomeScreen onNav={setRoute} onAdd={add}/>}
  {route.screen==="category"&&<CategoryScreen cat={route.cat} onNav={setRoute} onAdd={add}/>}
  {route.screen==="product"&&<ProductScreen id={route.id} onNav={setRoute} onAdd={add}/>}
  {route.screen==="cart"&&<CartScreen items={items} setItems={setItems} onNav={setRoute}/>}
  <Footer/>
  <WhatsAppCTA floating label="Chat with us"/>
 </div>;
}
setTimeout(()=>ReactDOM.createRoot(document.getElementById("root")).render(<App/>),0);
</script></body></html>
